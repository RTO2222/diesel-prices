name: Build search area

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace the area boundary
        run: python scripts/build_area.py
      - name: Commit area.geojson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add area.geojson
          git diff --cached --quiet || { git commit -m "Rebuild search area"; git push; }
